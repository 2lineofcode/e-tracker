name: expense_tracker
version: 1.0.0+159
publish_to: none
description: The Expense Tracker app is a handy tool for managing your personal finances. It allows you to easily track your expenses, categorize them, and analyze your spending patterns. With a user-friendly interface, the app provides features such as adding and editing expenses, setting budget goals, generating reports, and visualizing data through charts and graphs. Stay in control of your finances with the Expense Tracker app.

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  # core
  get: ^4.7.3
  get_storage: ^2.1.1
  supabase_flutter: ^2.18.2
  window_manager: ^0.5.2
  ex_kit: ^0.7.0
  google_fonts: ^9.0.0

  # ui
  cupertino_icons: ^2.0.0
  uicons_pro: ^1.2.0
  table_calendar: ^3.3.0
  grouped_list: ^6.0.0
  syncfusion_flutter_charts: ^35.1.39
  syncfusion_flutter_pdf: ^35.1.39
  fl_chart: ^1.2.0

  flutter_popup: ^3.3.9

  lottie: 3.6.1

  animated_icon: ^1.0.0
  glassmorphism_ui: ^0.3.0
  overlayment: ^0.2.1
  toastification: ^3.2.0

  # wysiwyg editor
  fleather: ^1.28.0

  # markdown
  markdown: ^7.3.1
  markdown_widget: ^2.3.2+8

  # picker
  file_picker: ^13.1.0

  # utils
  intl: ^0.20.3
  uuid: ^4.6.0
  currency_text_input_formatter: 2.3.2
  csv: ^8.0.0
  excel_plus: ^2.27.1
  image: ^4.10.2
  web: ^1.1.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  flutter_simple_calculator: ^2.7.1
  money_formatter: ^0.0.7
  url_launcher: ^6.3.3

  # sql editor
  postgres: ^3.5.20
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

  flutter:
    sdk: flutter

dev_dependencies:
  http: ^1.6.0
  enven: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/icons/

get_cli:
  sub_folder: false
