name: expense_tracker
version: 1.0.0+154
publish_to: none
description: The Expense Tracker app is a handy tool for managing your personal finances. It allows you to easily track your expenses, categorize them, and analyze your spending patterns. With a user-friendly interface, the app provides features such as adding and editing expenses, setting budget goals, generating reports, and visualizing data through charts and graphs. Stay in control of your finances with the Expense Tracker app.

environment:
  sdk: ^3.9.0

dependencies:
  # core
  get: ^4.7.3
  get_storage: ^2.1.1
  supabase_flutter: ^2.12.4
  groq: ^1.1.1
  window_manager: ^0.5.1
  ex_kit: ^0.7.0
  google_fonts: ^8.1.0
  hotkey_manager: ^0.2.3

  # check official repo: last update `flutter_gemini: ^3.0.0`
  flutter_gemini:
    git:
      url: https://github.com/AkhmadRamadani/flutter_gemini.git
      ref: master

  # ui
  cupertino_icons: ^1.0.9
  uicons_pro: ^1.1.0
  table_calendar: ^3.2.0
  grouped_list: ^6.0.0
  syncfusion_flutter_charts: ^33.2.7
  fl_chart: ^1.2.0

  animated_text_kit: ^4.3.0 # implement
  flutter_popup: ^3.3.9

  lottie: 3.3.3

  animated_icon: ^1.0.0
  glassmorphism_ui: ^0.3.0
  overlayment: ^0.2.1
  toastification: ^3.2.0

  # quill (wysiwyg editor)
  flutter_quill: 10.8.2

  # markdown
  markdown_toolbar: ^0.5.0
  markdown_widget: ^2.3.2+6

  # picker
  file_picker: ^12.0.0-beta.1

  # utils
  intl: ^0.20.2
  uuid: ^4.5.3
  currency_text_input_formatter: 2.3.0
  csv: ^8.0.0
  web: ^1.1.1
  path_provider: ^2.1.5
  package_info_plus: ^10.1.0
  flutter_simple_calculator: ^2.7.1
  money_formatter: ^0.0.7
  url_launcher: ^6.3.2
  flutter_lorem: ^2.0.0

  # spreadsheet
  worksheet: ^3.9.2
  worksheet_formula: ^1.3.0

  # sql editor
  postgres: ^3.5.11
  re_editor: ^0.8.0
  re_highlight: ^0.0.3

  flutter:
    sdk: flutter

dev_dependencies:
  enven: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

dependency_overrides:
  intl: ^0.20.2

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/icons/

get_cli:
  sub_folder: false
