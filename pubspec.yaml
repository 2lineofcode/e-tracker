name: expense_tracker
version: 1.0.0+135.20240606
publish_to: none
description: The Expense Tracker app is a handy tool for managing your personal finances. It allows you to easily track your expenses, categorize them, and analyze your spending patterns. With a user-friendly interface, the app provides features such as adding and editing expenses, setting budget goals, generating reports, and visualizing data through charts and graphs. Stay in control of your finances with the Expense Tracker app.
environment: 
  sdk: '>=3.1.0 <4.0.0'

dependencies:

  # core
  get: ^4.6.6
  get_storage: ^2.1.1
  supabase_flutter: ^2.5.4

  # ui
  ex_kit: ^0.6.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  table_calendar: ^3.1.1
  grouped_list: ^5.1.2
  custom_radio_grouped_button: ^2.2.1
  window_manager: ^0.3.9
  syncfusion_flutter_charts: ^25.2.7
  fl_chart: ^0.68.0
  animated_text_kit: ^4.2.2
  flutter_popup: ^3.3.0
  flutter_iconpicker_plus: ^3.2.3
  lottie: ^3.1.2
  animated_icon: ^0.0.9
  glassmorphism_ui: ^0.3.0
  overlayment: ^0.2.1

  # picker
  hsv_color_pickers: ^0.3.0
  flutter_colorpicker: ^1.1.0
  file_picker: ^8.0.3
  
  # utils
  intl: ^0.19.0
  currency_text_input_formatter: 2.2.3
  uuid: ^4.4.0
  csv: ^6.0.0
  path_provider: ^2.1.3
  package_info_plus: ^8.0.0
  flutter_simple_calculator: ^2.2.5
  money_formatter: ^0.0.6
  url_launcher: ^6.3.0

  flutter: 
    sdk: flutter

dev_dependencies: 
  enven: ^1.0.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_test: 
    sdk: flutter

dependency_overrides: 
  intl: ^0.19.0
  lottie: ^3.1.2

flutter: 
  uses-material-design: true
  assets:
  - assets/lottie/
  - assets/icons/

get_cli: 
  sub_folder: false

