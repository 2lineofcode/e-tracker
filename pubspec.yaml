name: expense_tracker
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=3.1.0 <4.0.0'

dependencies:

  # core
  get: ^4.6.6
  get_storage: ^2.1.1
  supabase_flutter: ^1.10.25
  flutter_dotenv: ^5.1.0

  # ui
  ex: ^0.5.1
  cupertino_icons: ^1.0.6
  table_calendar: ^3.0.9
  grouped_list: ^5.1.2
  window_manager: ^0.3.7
  syncfusion_flutter_charts: ^23.1.44
  flutter_popup: ^3.1.6
  flutter_iconpicker_plus: ^3.2.3

  # picker
  hsv_color_pickers: ^0.3.0
  flutter_colorpicker: ^1.0.3
  flutter_month_picker: ^0.0.2 
  
  # utils
  intl: ^0.18.1
  currency_text_input_formatter: ^2.1.10
  uuid: ^4.2.1

  # misc 
  flutter_simple_calculator: ^2.2.4

  flutter: 
    sdk: flutter

dev_dependencies: 
  flutter_lints: ^3.0.1
  flutter_launcher_icons: "^0.13.1"
  flutter_test: 
    sdk: flutter

dependency_overrides: 
  intl: ^0.18.1

flutter: 
  uses-material-design: true
  assets:
  - .env
  - .env.local

get_cli: 
  sub_folder: false

