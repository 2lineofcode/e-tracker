name: expense_tracker
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=3.1.0 <4.0.0'

dependencies:

  # core
  get: ^4.6.6
  get_storage: ^2.1.1
  supabase_flutter: ^1.10.24
  flutter_dotenv: ^5.1.0

  # ui
  ex: ^0.5.1
  cupertino_icons: ^1.0.2
  table_calendar: ^3.0.9
  grouped_list: ^5.1.2
  window_manager: ^0.3.7
  pie_chart: ^5.3.2

  # utils
  intl: ^0.18.1
  currency_text_input_formatter: ^2.1.10
  flutter_month_picker: ^0.0.2 
  uuid: ^4.1.0

  # misc 
  faker: ^2.1.0
  flutter_simple_calculator: ^2.2.4

  flutter: 
    sdk: flutter

dev_dependencies: 
  flutter_lints: ^2.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_test: 
    sdk: flutter

dependency_overrides: 
  intl: ^0.18.1

flutter: 
  uses-material-design: true
  assets:
  - .env
  - .env.local

get_cli: 
  sub_folder: false

