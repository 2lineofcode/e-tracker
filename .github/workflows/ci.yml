name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare env
        env:
          ENV_FILE: ${{ github.event_name != 'pull_request' && secrets.ENV_FILE || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            cp .env.example .env
          else
            test -n "$ENV_FILE" || { echo '::error::ENV_FILE secret is missing'; exit 1; }
            printf '#enven:output=lib/env.g.dart\n' > .env
            printf '%s\n' "$ENV_FILE" | grep -E '^(APP_NAME|SUPABASE_URL|SUPABASE_ANON_KEY)=' >> .env
          fi
          for key in APP_NAME SUPABASE_URL SUPABASE_ANON_KEY; do
            grep -qE "^${key}=.+" .env || { echo "::error::Missing env key: $key"; exit 1; }
          done

      - name: Generate secure env
        run: dart run enven

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
